
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi
          unzip -o "$ZIP" -d extracted
          find extracted -name settings.gradle -exec dirname {} \; | head -n 1 > project_dir.txt

      - name: Build APK
        run: |
          cd "$(cat project_dir.txt)"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cipher-debug-apk
          path: extracted/cipher_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
